{% extends "base.html" %}
{% block title %}Forgot your password{% endblock %}
{% block content %}
  <div class="auth-card">
    <h1>Forgot your password?</h1>
    <p class="lead">Enter your email to reset your password.</p>
    <form id="forgot-form">
      <label for="forgot-email">Email</label>
      <input id="forgot-email" type="email" autocomplete="username" required>
      <p id="error" class="error" role="alert"></p>
      <button type="submit">Continue</button>
    </form>
    <p id="forgot-result" class="banner spaced" hidden></p>
    <p class="switch"><a href="/login">Back to log in</a></p>
  </div>
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('static', filename='js/forgot.js') }}"></script>
{% endblock %}
