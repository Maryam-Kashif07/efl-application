<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EFL{% endblock %}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav>
    <a class="logo" href="/">EFL</a>
    <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Home</a>
    <a href="/dashboard" {% if request.path == '/dashboard' %}class="active"{% endif %}>Dashboard</a>
    <a href="/converter" {% if request.path == '/converter' %}class="active"{% endif %}>Converter</a>
    <a href="/quote-page" {% if request.path == '/quote-page' %}class="active"{% endif %}>Quote</a>
    <a href="/history-page" {% if request.path == '/history-page' %}class="active"{% endif %}>History</a>
    {% if session.get("user_id") %}
    <a href="#" id="logout-link">Sign out</a>
    {% else %}
    <a href="/login" {% if request.path in ['/login', '/register', '/forgot-password', '/reset-password'] %}class="active"{% endif %}>Sign in</a>
    {% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
