{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
  <div class="auth-card">
    <h1>Reset Password</h1>
    <form id="reset-form">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" required>
      <p class="hint">At least 8 characters, with a letter and a number.</p>
      <p id="error" class="error" role="alert"></p>
      <button id="reset-button" type="submit">Reset Password</button>
    </form>
    <p class="switch"><a href="/login">Back to log in</a></p>
  </div>
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('static', filename='js/reset.js') }}"></script>
{% endblock %}
